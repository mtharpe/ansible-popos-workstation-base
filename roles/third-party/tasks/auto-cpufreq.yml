---
# Pop!_OS manages CPU governors and power profiles with system76-power.
# auto-cpufreq fights it for the same knobs, so refuse rather than install a
# second power manager.
- name: Gather service state
  ansible.builtin.service_facts:
  tags: [third_party, autocpu]

- name: Refuse auto-cpufreq alongside system76-power
  ansible.builtin.assert:
    that: >-
      (ansible_facts.services['system76-power.service'] | default({})).get('state') != 'running'
    fail_msg: >-
      install_autocpu is true but system76-power is active. Pop!_OS already
      manages CPU power; set install_autocpu: false.
  tags: [third_party, autocpu]

- name: Remove conflicting Auto-CPUFreq snap
  ansible.builtin.include_tasks:
    file: remove-snap.yml
    apply:
      tags: [third_party, autocpu]
  vars:
    snap_names: [auto-cpufreq]
  tags: [third_party, autocpu]

- name: Clone Auto-CPUFreq repository
  ansible.builtin.git:
    repo: https://github.com/AdnanHodzic/auto-cpufreq.git
    dest: /tmp/autocpu
    version: master
  tags: [third_party, autocpu]

- name: Install Auto-CPUFreq build dependencies
  ansible.builtin.apt:
    name:
      - python3-dev
      - dmidecode
    state: present
  become: true
  tags: [third_party, autocpu]

- name: Install Python requirements for Auto-CPUFreq
  ansible.builtin.pip:
    requirements: /tmp/autocpu/requirements.txt
  become: true
  tags: [third_party, autocpu]

- name: Build & install Auto-CPUFreq
  ansible.builtin.command:
    cmd: python3 setup.py install --record files.txt
    chdir: /tmp/autocpu
    creates: /usr/local/bin/auto-cpufreq
  become: true
  tags: [third_party, autocpu]

- name: Ensure auto-cpufreq directory exists
  ansible.builtin.file:
    path: /usr/local/share/auto-cpufreq/
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [third_party, autocpu]

- name: Copy Auto-CPUFreq scripts
  ansible.builtin.copy:
    src: /tmp/autocpu/scripts/
    dest: /usr/local/share/auto-cpufreq/
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true
  tags: [third_party, autocpu]

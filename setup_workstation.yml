---
- name: Setup Workstation
  hosts: workstation
  become: true
  gather_facts: true

  vars_files:
    - vars/vars.yml

  roles:
    - common
    - third-party
    - role: cosmic
      when: not common_is_container | default(false)

  handlers:
    - name: Import shared handlers
      ansible.builtin.import_tasks: handlers/main.yml

---
# This file is the tracked sane defaults for the playbook.
#
# On a fresh checkout: `cp vars/vars.example.yml vars/vars.yml` and edit
# vars/vars.yml for your personal toggles — it's gitignored.
#
# Edit THIS file (vars.example.yml) only when you want to change the defaults
# that ship in the repo, not for one-off local preferences.

# User
local_user: tharpem
local_user_email: mtharpe@noemail.not

# Services
enable_fail2ban: true
enable_sshd: false

# Subnet exempted from fail2ban (e.g. "192.168.1.0/24"). Empty = loopback only.
local_network: ""

# Extras
install_printers: true

# Desktop extras: GUI apps (nextcloud-desktop, celluloid, mpv, transmission),
# VA-API hardware video accel, GStreamer media codecs, WirePlumber ALSA config,
# and the junk-app purge. Set false on a headless box.
install_desktop_extras: true

# Skip the Pop!_OS host check (roles/common/tasks/preflight.yml). Only for
# container tests — the playbook assumes Pop!_OS + COSMIC everywhere else.
popos_skip_preflight: false

# Preinstalled apps purged on desktop installs. Reconciled against the Pop!_OS
# 24.04 preinstalled list in docs/cosmic-keys.md.
common_junk_packages:
  - firefox
  - thunderbird
  - libreoffice-core
  - libreoffice-common
  - libreoffice-writer
  - libreoffice-calc
  - libreoffice-impress
  - libreoffice-draw
  - libreoffice-base-core
  - libreoffice-math
  - rhythmbox
  - totem
  - vlc
  - gnome-calendar
  - gnome-contacts
  - gnome-maps
  - gnome-logs

# The junk purge refuses to run if apt would remove any of these with it.
common_protected_packages:
  - pop-desktop
  - cosmic-session
  - cosmic-comp

# Third party
install_chrome: true
install_slack: true
install_spotify: false
install_vscode: true
install_zoom: true
install_lutris: false
install_steam: false
install_docker: false
install_gcloud: false
install_chef: false
install_autocpu: false
install_alacritty: true
install_bash: false
install_fish: true
install_starship: false
install_nerd_font: true
install_eza: true
install_claude: true
install_claude_desktop: true
install_kubectl: true

# python3
ansible_python_interpreter: /usr/bin/python3

# Pop!_OS target version, checked by roles/common/tasks/preflight.yml.
popos_version: "24.04"

# Header stamped into rendered config files via `{{ ansible_managed }}`.
# Replaces the deprecated DEFAULT_MANAGED_STR setting in ansible.cfg.
ansible_managed: "Ansible managed — do not edit by hand"
